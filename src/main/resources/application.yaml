server:
  port: 80

cors:
  originPatterns: ${CORS_ORIGINS:http://localhost:3000}

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY}
      expire-length: ${JWT_EXPIRATION:3600000}

spring:
  application:
    name: products-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_products_api}?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 2

app:
  password-reset:
    token-expiry-hours: ${PASSWORD_RESET_TOKEN_EXPIRY_HOURS:1}
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:80}

logging:
  level:
    com.maxzdosreis: DEBUG

spring-doc:
  paths-to-match:
    - /auth/**
    - /api/**
  swagger-ui:
    use-root-path: true